name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/pr-ci.yml

  release:
    name: Build and Release
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run app

      - name: Package app bundle
        run: ditto -c -k --keepParent dist/nudgit.app nudgit-macos.zip

      - name: Build Chrome extension
        run: npm run extension

      - name: Create release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release for tag ${GITHUB_REF_NAME} already exists, skipping."
            exit 0
          fi

          # Hyphenated tags (e.g. v1.3.0-rc.1) are semver pre-releases
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac

          # For annotated tags, keep the hand-written tag message as the release
          # body intro; --generate-notes appends the auto-generated notes to it.
          tag_object="$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type + " " + .object.sha')"
          if [ "${tag_object%% *}" = "tag" ]; then
            tag_message="$(gh api "repos/${GH_REPO}/git/tags/${tag_object#tag }" --jq '.message')"
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$tag_message" "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}"
          fi

      - name: Upload app bundle to release
        run: gh release upload "$GITHUB_REF_NAME" nudgit-macos.zip --clobber

      - name: Upload Chrome extension to release
        run: gh release upload "$GITHUB_REF_NAME" dist/nudgit-chrome-extension.zip --clobber
